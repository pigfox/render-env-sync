name: Release

on:
  push:
    tags: ["v*"]

# Needed to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so that --generate-notes can diff against the
          # previous tag rather than seeing a single grafted commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      # CI runs on branches, not tags, so a tag push would otherwise publish
      # without any test having run against that exact commit. Gate here.
      - name: Test
        run: go test ./... -race

      - name: Build release artifacts
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}" dist

      - name: Show checksums
        run: cat dist/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/renv_*.tar.gz \
            dist/renv_*.zip \
            dist/SHA256SUMS
